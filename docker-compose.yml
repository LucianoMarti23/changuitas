version: '3.9'

services:
  app:
    build: .
    container_name: laravel_app
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
      - /var/www/html/node_modules
      - ./database:/var/www/html/database
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: sqlite
    command: bash -c "php artisan serve --host=0.0.0.0 --port=8000"
